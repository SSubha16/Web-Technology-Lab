<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment - Temperature & Humidity Monitor</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f9f9f9;
            margin: 20px;
            color: #333;
        }

        .main-container {
            width: 80%;
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        h2 {
            text-align: center;
            margin-top: 5px;
            margin-bottom: 20px;
            color: #222;
        }

        .btn-group {
            text-align: center;
            margin-bottom: 15px;
        }

        button {
            font-size: 14px;
            padding: 8px 18px;
            margin: 0 5px;
            border: 1px solid #999;
            background-color: #e9e9e9;
            cursor: pointer;
            border-radius: 3px;
        }

        button:hover {
            background-color: #ddd;
        }

        .status-box {
            text-align: center;
            margin-bottom: 20px;
            font-size: 15px;
        }

        #status {
            font-weight: bold;
            color: #555;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        table, th, td {
            border: 1px solid #bbb;
        }

        th {
            background-color: #eaeaea;
            padding: 10px;
            font-size: 14px;
            text-align: center;
        }

        td {
            padding: 8px;
            text-align: center;
            font-size: 14px;
        }

        .temp-text {
            color: #c0392b;
            font-weight: bold;
        }

        .humid-text {
            color: #2980b9;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="main-container">

    <h2>Temperature &amp; Humidity Simulator</h2>

    <div class="btn-group">
        <button id="startBtn">Start</button>
        <button id="stopBtn">Stop</button>
    </div>

    <div class="status-box">
        Current Status: <span id="status">Stopped</span>
    </div>

    <table>
        <thead>
            <tr>
                <th>Sl. No.</th>
                <th>Date &amp; Time</th>
                <th>Temperature (&deg;C)</th>
                <th>Humidity (%)</th>
            </tr>
        </thead>
        <tbody id="dataTable">
        </tbody>
    </table>

</div>

<script>
    var eventSource = null;
    var count = 0;

    var startBtn = document.getElementById("startBtn");
    var stopBtn = document.getElementById("stopBtn");
    var statusText = document.getElementById("status");
    var tableBody = document.getElementById("dataTable");

    startBtn.onclick = function () {
        if (eventSource !== null) {
            return;
        }

        eventSource = new EventSource("simulator.php");
        statusText.innerText = "Running...";
        statusText.style.color = "green";

        eventSource.onmessage = function (event) {
            var data = JSON.parse(event.data);
            count++;

            var tr = document.createElement("tr");

            tr.innerHTML = `
                <td>` + count + `</td>
                <td>` + data.datetime + `</td>
                <td class="temp-text">` + data.temperature + ` &deg;C</td>
                <td class="humid-text">` + data.humidity + ` %</td>
            `;

            tableBody.appendChild(tr);

            if (tableBody.rows.length > 20) {
                tableBody.deleteRow(0);
            }
        };

        eventSource.onerror = function () {
            statusText.innerText = "Connection Failed";
            statusText.style.color = "red";
        };
    };

    stopBtn.onclick = function () {
        if (eventSource !== null) {
            eventSource.close();
            eventSource = null;

            statusText.innerText = "Stopped";
            statusText.style.color = "#555";
        }
    };
</script>

</body>

</html>
